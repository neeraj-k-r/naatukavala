# Netlify deploys ONLY the frontend (the Express API lives on Render).
# Import the repo, keep these settings; paste env vars in the dashboard.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Required env vars (Site settings → Environment variables, set BEFORE building):
#   NEXT_PUBLIC_API_URL          https://<render-service>.onrender.com
#   NEXT_PUBLIC_APP_DOMAIN       <site>.netlify.app (update + rebuild after first deploy)
#   NEXT_PUBLIC_COOKIE_DOMAIN    (leave empty until a custom domain with subdomains)
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
